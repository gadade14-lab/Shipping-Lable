<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> SHIPPING LABEL</title>
    <!-- JsBarcode Library for generating tech barcodes dynamically -->
    <script src="jsdelivr.net"></script>
    <style>
        /* ==========================================
           PREMIUM ELITE LIGHT INTERFACE (UI)
           ========================================== */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 25px;
            background-color: #f4f6f9; 
            color: #1e293b;
            min-height: 100vh;
        }

        .header-area { 
            max-width: 900px; 
            margin: 0 auto 15px auto; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }
        
        h2 { 
            margin: 0; 
            color: #0f172a; 
            font-size: 26px; 
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* Color-Coded Light Panels */
        .control-panel {
            background: #ffffff;
            max-width: 900px;
            margin: 0 auto 25px auto;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.05);
            border: 2px solid #bae6fd; 
            border-top: 6px solid #0284c7;
        }

        .search-container {
            background: #fffbeb;
            max-width: 900px;
            margin: 25px auto;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(234, 179, 8, 0.05);
            border: 2px dashed #fef08a; 
            box-sizing: border-box;
        }

        .history-panel {
            background: #ffffff;
            max-width: 900px;
            margin: 0 auto 25px auto;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.05);
            border: 2px solid #a7f3d0; 
            border-top: 6px solid #10b981;
        }

        .setup-panel { 
            background: #f8fafc; 
            max-width: 900px;
            margin: 0 auto 25px auto;
            padding: 25px;
            border-radius: 16px;
            border: 2px solid #cbd5e1;
            border-top: 6px solid #64748b; 
        }

        .section-title { 
            font-size: 16px; 
            font-weight: 800; 
            color: #1e293b; 
            text-transform: uppercase; 
            margin: 0 0 20px 0; 
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 220px; display: flex; flex-direction: column; }
        
        label { 
            font-size: 13px; 
            font-weight: 700; 
            margin-bottom: 8px; 
            color: #475569; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        input, textarea { 
            padding: 14px; 
            border: 1px solid #cbd5e1; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: 600;
            outline: none; 
            background-color: #ffffff; 
            color: #0f172a;
            transition: all 0.2s ease;
        }
        
        input:focus, textarea:focus { 
            border-color: #0284c7; 
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }
        
        .search-input { 
            width: 100%; 
            padding: 14px; 
            border: 1px solid #f59e0b; 
            border-radius: 10px; 
            font-size: 18px; 
            font-weight: 700; 
            background-color: #ffffff;
            color: #b45309;
        }
        .search-input:focus {
            border-color: #d97706;
            box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.15);
        }

        /* Buttons */
        .btn-group { display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        button { 
            padding: 14px 28px; 
            border: none; 
            border-radius: 10px; 
            font-size: 14px; 
            font-weight: 800; 
            cursor: pointer; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.15s ease; 
        }
        button:hover { transform: translateY(-1px); opacity: 0.95; }
        button:active { transform: translateY(0); }
        
        .btn-primary { background-color: #0284c7; color: #ffffff; box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.2); }
        .btn-success { background-color: #10b981; color: #fff; box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2); }
        .btn-danger { background-color: #ef4444; color: #fff; box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.1); }
        .btn-settings { background-color: #ffffff; color: #475569; padding: 10px 16px; font-size: 13px; border-radius: 8px; border: 1px solid #cbd5e1; font-weight: 700; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); }
        .btn-settings:hover { background-color: #f8fafc; color: #0f172a; }
        
        .btn-edit { background-color: #fef3c7; color: #92400e; padding: 7px 14px; font-size: 13px; border-radius: 6px; border: 1px solid #fde68a; font-weight: bold; cursor: pointer; }
        .btn-edit:hover { background-color: #fde68a; }
        .btn-delete { background-color: #fee2e2; color: #991b1b; padding: 7px 14px; font-size: 13px; border-radius: 6px; border: 1px solid #fca5a5; font-weight: bold; cursor: pointer; margin-left: 5px; }
        .btn-delete:hover { background-color: #fca5a5; }

        /* History Table View */
        .history-table-wrapper { max-height: 250px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 10px; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 15px; text-align: left; background-color: #ffffff; }
        th, td { padding: 14px; border-bottom: 1px solid #e2e8f0; color: #334155; }
        th { background-color: #f8fafc; color: #10b981; font-weight: 800; position: sticky; top: 0; z-index: 10; border-bottom: 2px solid #10b981; }
        tr:hover { background-color: #f8fafc; }

        /* ==========================================
           SHIPPING LABEL STICKER GRID DESIGN
           ========================================== */
        #printAreaContainer {
            display: none;
        }

        .shipping-label {
            background: #ffffff;
            border: 2px dashed #000000;
            padding: 10px;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            height: auto; 
            min-height: unset; 
            color: #000000; 
        }

        .label-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #000; 
            padding-bottom: 4px; 
            margin-bottom: 4px; 
        }
        .label-header .title { font-size: 15px; font-weight: 900; text-transform: uppercase; }
        .label-header .box-count-badge { background: #000000; color: #ffffff; padding: 2px 5px; font-size: 11px; font-weight: 900; border-radius: 4px; border: 1px solid #000; text-transform: uppercase; }

        .barcode-area { 
            text-align: center; 
            margin: 0 auto; 
            padding: 0;
            width: 100%; 
            display: flex;
            justify-content: center;
        }
        .barcode-img { 
            max-width: 100%; 
            height: 40px; 
            display: block;
            margin: 0;
            padding: 0;
        }

        .label-body {
            margin-top: 0px; 
            padding-top: 0px;
        }

        .field-group { 
            width: 100%; 
            margin-bottom: 5px; 
        }
        
        .field-group.first-field {
            margin-top: -2px; 
        }
        
        .field-label { font-size: 8.5px; text-transform: uppercase; color: #475569; font-weight: 700; margin-bottom: 0px; }
        .field-value { font-size: 14px; color: #000; line-height: 1.2; font-weight: 500; white-space: normal !important; word-wrap: break-word !important; }
        .cust-name { font-size: 15px; font-weight: 800; color: #000; }

        .important-data { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; border-top: 2px solid #000; padding-top: 6px; margin-top: 4px; }
        .data-box { background: #f8fafc; border: 1px solid #000; padding: 5px; border-radius: 4px; display: flex; flex-direction: column; justify-content: center; }
        .pincode-box .field-value { font-size: 18px; font-weight: 900; letter-spacing: 1px; }
        .phone-box .field-value { font-size: 16px; font-weight: 950; color: #000; word-break: break-all; }

        .label-footer { margin-top: 5px; border-top: 2px solid #000; padding-top: 4px; font-size: 10.5px; line-height: 1.2; color: #111; }

        /* ==========================================
           100% PERFECT A4 GRID PRINT CSS
           ========================================== */
        @media print {
            .control-panel, .history-panel, .search-container, .btn-group, h2, label, input, textarea, .setup-panel, .header-area { 
                display: none !important; 
            }
            body { padding: 0 !important; margin: 0 !important; background: #ffffff !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            
            #printAreaContainer { 
                display: grid !important; 
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 12px !important;
                width: 100% !important;
                max-width: 100% !important;
                padding: 10px !important;
                box-sizing: border-box !important;
            }

            .shipping-label { 
                display: flex !important; 
                border: 2px solid #000000 !important; 
                page-break-inside: avoid !important;
                background-color: #ffffff !important; 
                height: auto !important;
                min-height: unset !important;
            }
            
            .data-box { background: #ffffff !important; border: 1px solid #000000 !important; }
        }
    </style>
</head>
<body>

    <!-- TOP HEADER -->
    <div class="header-area">
        <h2>HI-TECH SHIPPING LABEL</h2>
        <button class="btn-settings" onclick="toggleSetupPanel()">⚙️ Settings</button>
    </div>

    <!-- SENDER REGISTRATION PANEL -->
    <div class="setup-panel" id="setupPanel">
        <div class="section-title">⚙️ Sender Setup & Security PIN</div>
        <div class="row">
            <div class="col" style="flex: 2;">
                <label>Company/Sender Name</label>
                <input type="text" id="fromName" placeholder="Your business name">
            </div>
            <div class="col">
                <label>Sender Contact No.</label>
                <input type="text" id="fromPhone" placeholder="Mobile number">
            </div>
            <div class="col" style="flex: 0.5; min-width: 120px;">
                <label>Set 4-Digit PIN</label>
                <input type="password" id="appSecurityPin" value="1234" maxlength="4">
            </div>
        </div>
        <div class="row">
            <div class="col">
                <label>Sender Full Address</label>
                <textarea id="fromAddress" rows="2" placeholder="Full shop/office address"></textarea>
            </div>
        </div>
        <div><button class="btn-success" onclick="saveSenderInfo()">Save Settings</button></div>
    </div>

    <!-- MAIN CONTROL PANEL -->
    <div class="control-panel">
        <div class="section-title" id="formActionTitle" style="color: #0284c7;">🔹 Customer Entry Form</div>
        <input type="hidden" id="editIndex" value="-1"> 
        <div class="row">
            <div class="col" style="flex: 2;">
                <label>Customer Name (पार्टी का नाम)</label>
                <input type="text" id="toName" placeholder="Customer Full Name">
            </div>
            <div class="col" style="flex: 1;">
                <label>Mobile Number (मोबाइल नं.)</label>
                <input type="text" id="toPhone" placeholder="Mobile Number">
            </div>
            <div class="col" style="flex: 0.5; min-width: 100px;">
                <label>Total Boxes</label>
                <input type="number" id="toBoxes" value="1" min="1">
            </div>
        </div>
        <div class="row">
            <div class="col" style="flex: 3;">
                <label>Delivery Address (पूरा पता)</label>
                <input type="text" id="toAddress" placeholder="Shipping Address">
            </div>
            <div class="col">
                <label>Pincode (पिनकोड)</label>
                <input type="text" id="toPincode" placeholder="Pincode">
            </div>
        </div>
        <div style="margin-top: 10px;">
            <button class="btn-primary" id="saveBtn" onclick="saveCustomerData()">Save Party</button>
            <button class="btn-danger" id="cancelEditBtn" onclick="resetForm()" style="display:none;">Clear Form</button>
        </div>
        
        <!-- LIVE SEARCH BOX TERMINAL -->
        <div class="search-container">
            <label style="color: #b45309; font-size: 14px; font-weight: bold;">🔍 Live Search & Auto-Fill Form Terminal</label>
            <input type="text" id="searchBox" class="search-input" placeholder="Type letters/numbers to fill form instantly..." oninput="handleLiveSearchAndAutofill()">
        </div>
        
        <!-- UI Action Buttons -->
        <div class="btn-group">
            <button class="btn-success" onclick="executeCurrentPrint()">🖨️ Print Current Label Now</button>
            <button class="btn-danger" onclick="clearAllLabels()">Clear Database</button>
        </div>
    </div>

    <!-- HISTORY PANEL -->
    <div class="history-panel">
        <div class="section-title" style="color: #10b981;">📋 Customer Database History Cluster</div>
        <div class="history-table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width: 5%;">Sr.</th>
                        <th style="width: 25%;">Customer Name</th>
                        <th style="width: 35%;">Address</th>
                        <th style="width: 15%;">Mobile</th>
                        <th style="width: 10%;">Boxes</th>
                        <th style="width: 10%;">Actions</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- LABELS OUTPUT GRID (सिर्फ प्रिंट प्रीव्यू में चालू होगा) -->
    <div class="labels-grid" id="printAreaContainer"></div>

    <!-- JavaScript Core Logic Engine -->
    <script>
        let allLabelsData = [];

        window.onload = function() {
            if (localStorage.getItem('senderName')) document.getElementById('fromName').value = localStorage.getItem('senderName');
            if (localStorage.getItem('senderPhone')) document.getElementById('fromPhone').value = localStorage.getItem('senderPhone');
            if (localStorage.getItem('senderAddress')) document.getElementById('fromAddress').value = localStorage.getItem('senderAddress');
            
            if (localStorage.getItem('appSecurityPin')) {
                document.getElementById('appSecurityPin').value = localStorage.getItem('appSecurityPin');
            } else {
                localStorage.setItem('appSecurityPin', '1234');
            }
            
            if (localStorage.getItem('senderName') && localStorage.getItem('senderAddress')) {
                document.getElementById('setupPanel').style.display = 'none'; 
            } else {
                document.getElementById('setupPanel').style.display = 'block';
            }

            if (localStorage.getItem('savedCustomers')) {
                allLabelsData = JSON.parse(localStorage.getItem('savedCustomers'));
            }

            renderHistoryTable();
        };

        function saveSenderInfo() {
            const name = document.getElementById('fromName').value.trim();
            const phone = document.getElementById('fromPhone').value.trim();
            const address = document.getElementById('fromAddress').value.trim();
            const pin = document.getElementById('appSecurityPin').value.trim();

            if (!name || !address || pin.length !== 4) {
                alert("Please fill Name, Address, and a valid 4-Digit PIN!");
                return;
            }

            localStorage.setItem('senderName', name);
            localStorage.setItem('senderPhone', phone);
            localStorage.setItem('senderAddress', address);
            localStorage.setItem('appSecurityPin', pin);

            document.getElementById('setupPanel').style.display = 'none'; 
            alert("Sender Information Saved Successfully!");
        }

        function toggleSetupPanel() {
            const panel = document.getElementById('setupPanel');
            panel.style.display = (panel.style.display === 'none' || panel.style.display === '') ? 'block' : 'none';
        }

        function handleLiveSearchAndAutofill() {
            renderHistoryTable();

            const query = document.getElementById('searchBox').value.toLowerCase().trim();
            if (query.length < 2) return; 

            const matchIndex = allLabelsData.findIndex(item => {
                return (item.name || "").toLowerCase().includes(query) || (item.phone || "").toLowerCase().includes(query);
            });

            if (matchIndex > -1) {
                const item = allLabelsData[matchIndex];
                document.getElementById('toName').value = item.name;
                document.getElementById('toAddress').value = item.address;
                document.getElementById('toPincode').value = item.pincode;
                document.getElementById('toPhone').value = item.phone;
                document.getElementById('toBoxes').value = item.boxes || 1;
                document.getElementById('editIndex').value = matchIndex;

                document.getElementById('formActionTitle').innerText = "✏️ Saved Party Found (Ready to Save)";
                document.getElementById('cancelEditBtn').style.display = "inline-block";
            }
        }

        function saveCustomerData() {
            const name = document.getElementById('toName').value.trim();
            const address = document.getElementById('toAddress').value.trim();
            const pincode = document.getElementById('toPincode').value.trim();
            const phone = document.getElementById('toPhone').value.trim();
            const boxes = parseInt(document.getElementById('toBoxes').value) || 1;
            const editIndex = parseInt(document.getElementById('editIndex').value);

            if (!name || !address) {
                alert("Name and Address parameters are required!");
                return;
            }

            if (editIndex > -1) {
                allLabelsData[editIndex] = { name, address, pincode, phone, boxes };
            } else {
                allLabelsData.push({ name, address, pincode, phone, boxes });
            }

            localStorage.setItem('savedCustomers', JSON.stringify(allLabelsData));
            resetForm();
            renderHistoryTable();
            alert("Customer saved to database history!");
        }

        function editLabel(index) {
            const item = allLabelsData[index];
            document.getElementById('toName').value = item.name;
            document.getElementById('toAddress').value = item.address;
            document.getElementById('toPincode').value = item.pincode;
            document.getElementById('toPhone').value = item.phone;
            document.getElementById('toBoxes').value = item.boxes || 1;
            document.getElementById('editIndex').value = index;

            document.getElementById('formActionTitle').innerText = "✏️ Edit Party Details";
            document.getElementById('cancelEditBtn').style.display = "inline-block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteLabel(index) {
            const savedPin = localStorage.getItem('appSecurityPin') || '1234';
            const userPin = prompt("Enter 4-Digit Security PIN to Delete this customer:");
            if (userPin === null) return;
            if (userPin === savedPin) {
                allLabelsData.splice(index, 1);
                localStorage.setItem('savedCustomers', JSON.stringify(allLabelsData));
                renderHistoryTable();
                resetForm();
                alert("Record deleted.");
            } else {
                alert("❌ Wrong PIN Lock! Action denied.");
            }
        }

        function resetForm() {
            document.getElementById('toName').value = '';
            document.getElementById('toAddress').value = '';
            document.getElementById('toPincode').value = '';
            document.getElementById('toPhone').value = '';
            document.getElementById('toBoxes').value = '1';
            document.getElementById('editIndex').value = '-1';
            document.getElementById('searchBox').value = '';
            document.getElementById('formActionTitle').innerText = "Customer Entry Form";
            document.getElementById('cancelEditBtn').style.display = "none";
            renderHistoryTable();
        }

        function clearAllLabels() {
            const savedPin = localStorage.getItem('appSecurityPin') || '1234';
            const userPin = prompt("Enter 4-Digit Security PIN to clear main database:");
            if (userPin === null) return;
            if (userPin === savedPin) {
                if (confirm("Are you sure you want to clear the entire database?")) {
                    allLabelsData = [];
                    localStorage.removeItem('savedCustomers');
                    resetForm();
                    alert("Database cleared successfully!");
                }
            } else {
                alert("❌ Security Lock: Incorrect PIN!");
            }
        }

        function renderHistoryTable() {
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '';
            const query = document.getElementById('searchBox').value.toLowerCase().trim();

            allLabelsData.forEach((item, index) => {
                const combinedText = `${item.name} ${item.address} ${item.phone}`.toLowerCase();
                if (query === '' || combinedText.includes(query)) {
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${index + 1}</strong></td>
                            <td>${item.name || '-'}</td>
                            <td>${item.address} (${item.pincode})</td>
                            <td><strong>${item.phone}</strong></td>
                            <td><strong>${item.boxes || 1} Box(es)</strong></td>
                            <td>
                                <button class="btn-edit" onclick="editLabel(${index})">Edit</button>
                                <button class="btn-delete" onclick="deleteLabel(${index})">Del</button>
                            </td>
                        </tr>`;
                }
            });
        }

        function executeCurrentPrint() {
            const name = document.getElementById('toName').value.trim();
            const address = document.getElementById('toAddress').value.trim();
            const pincode = document.getElementById('toPincode').value.trim();
            const phone = document.getElementById('toPhone').value.trim();
            const boxes = parseInt(document.getElementById('toBoxes').value) || 1;

            if (!name || !address) {
                alert("प्रिंट करने के लिए फॉर्म में कम से कम नाम और पता होना अनिवार्य है!");
                return;
            }

            const fromName = document.getElementById('fromName').value || '[Company Name]';
            const fromPhone = document.getElementById('fromPhone').value || '[Phone]';
            const fromAddress = document.getElementById('fromAddress').value || '[Address]';

            const printGrid = document.getElementById('printAreaContainer');
            printGrid.innerHTML = ''; 

            for (let i = 1; i <= boxes; i++) {
                const uniqueId = `print_bc_${i}`;
                const barcodePayload = (phone ? phone.replace(/[^0-9]/g, '').substring(0,10) : '0000000000') + (pincode ? pincode.replace(/[^0-9]/g, '').substring(0,6) : '000000');
                
                printGrid.innerHTML += `
                    <div class="shipping-label">
                        <div class="label-header">
                            <div class="title">HI-TECH SHIPPING LABEL</div>
                            <div class="box-count-badge">BOX: ${i} of ${boxes}</div>
                        </div>
                        <div class="barcode-area">
                            <svg class="barcode-img" id="${uniqueId}"></svg>
                        </div>
                        <div class="label-body">
                            <div class="field-group first-field">
                                <div class="field-label">Customer Name / पार्टी का नाम</div>
                                <div class="field-value cust-name">${name}</div>
                            </div>
                            <div class="field-group">
                                <div class="field-label">Delivery Destination / पता</div>
                                <div class="field-value">${address}</div>
                            </div>
                            <div class="important-data">
                                <div class="data-box pincode-box">
                                    <div class="field-label">Pincode / पिनकोड</div>
                                    <div class="field-value">${pincode || '-'}</div>
                                </div>
                                <div class="data-box phone-box">
                                    <div class="field-label">Contact / मोबाइल नं.</div>
                                    <div class="field-value">${phone || '-'}</div>
                                </div>
                            </div>
                        </div>
                        <div class="label-footer">
                            <strong>From / प्रेषक:</strong> ${fromName}<br>${fromAddress} | Ph: ${fromPhone}
                        </div>
                    </div>`;
                    
                setTimeout(() => {
                    try {
                        JsBarcode(`#${uniqueId}`, barcodePayload, {
                            format: "CODE128",
                            lineColor: "#000",
                            width: 1.5,
                            height: 40,
                            displayValue: true,
                            fontSize: 10,
                            margin: 0
                        });
                    } catch (e) {
                        console.log("Barcode error pass");
                    }
                }, 30);
            }

            setTimeout(() => {
                window.print();
            }, 300);
        }
    </script>
</body>
</html>
